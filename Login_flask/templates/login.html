<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="header" align="center">
        <h1>LOGIN</h1>
    </div>
    <div class="section" align="center">
        <form action="/login" method="POST">
            <div class="msg">{{msg}}</div>
            <input type="text" name="username" id="username" placeholder="Enter your username" class="textbox">
            <br>
            <br>
            <input type="password" name="password" id="pass" placeholder="Enter your password" class="textbox"> 
            <br>
            <br>
            <input type="submit" name="submit" value="Login" class="btn">
            <br>
        </form>
    </div>
    <div class="footer">
        <p class="bottom">Don't have an account?? <a href="registration.html" class="bottom">Sign up here!</a></p>
    </div>
</body>
</html>
